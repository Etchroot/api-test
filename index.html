<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>이달의 농식품</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <h1>이달의 농식품</h1>
    <p>달을 고르고, 마음에 드는 식재료 카드를 눌러 자세한 정보를 확인하세요</p>
  </header>

  <nav class="months-nav" aria-label="월 선택"><div class="months" id="months"></div></nav>
  <p class="status" id="status" role="status"></p>

  <section class="calendar" aria-labelledby="cal-title">
    <div class="cal-frame" id="frame">
      <div class="cal-bg" id="cal-bg" aria-hidden="true"></div>
      <div class="cal-head">
        <h2 id="cal-title">이달의 농식품</h2>
        <span class="meta" id="cal-meta"></span>
      </div>
      <div class="stage"><div class="wall" id="wall"><div class="grid" id="grid"></div></div></div>
      <p class="credit" id="credit"></p>
    </div>
  </section>

  <div id="apibox-slot"></div>

  <footer>
    데이터 출처: 공공데이터포털 농촌진흥청 이달의 농식품 · 식재료 목록 기준일 <span id="fixed-at"></span> · 사진: Unsplash
  </footer>

  <script src="sample-data.js"></script>
  <script src="foods-data.js"></script>
  <!-- 각자 로컬에 config.js 를 만든다 (config.example.js 참고). 없으면 404 가 나며 기본 데이터로 표시된다 -->
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    const $months = document.getElementById("months");
    const $grid = document.getElementById("grid");
    const $wall = document.getElementById("wall");
    const $frame = document.getElementById("frame");
    const $status = document.getElementById("status");
    const thisMonth = new Date().getMonth() + 1;

    // ── 상단 월 선택 (1월 ~ 12월) ─────────────────
    for (let m = 1; m <= 12; m++) {
      const b = el("button", `${m}월`);
      b.type = "button";
      b.dataset.month = m;
      b.setAttribute("aria-pressed", "false");
      if (m === thisMonth) { b.classList.add("now"); b.title = "이번 달"; }
      b.addEventListener("click", () => select(m));
      $months.append(b);
    }

    // ── 3D 기울기: 버튼 / 마우스 드래그 (휠은 페이지 스크롤을 가로채므로 쓰지 않는다) ──
    const TILT0 = reduceMotion ? { x: 0, y: 0 } : { x: 14, y: 0 };
    let tiltX = TILT0.x, tiltY = TILT0.y;
    const PERSPECTIVE = 1400, Z_MAX = 52; // style.css 의 .stage perspective 와 같아야 한다 / 카드의 최대 튀어나옴(z + hover)
    function setTilt(x, y) {
      tiltX = Math.max(0, Math.min(50, x));
      tiltY = Math.max(-35, Math.min(35, y));
      $wall.style.setProperty("--tx", `${tiltX}deg`);
      $wall.style.setProperty("--ty", `${tiltY}deg`);
      fit();
    }

    // 기울이면 가까워진 가장자리가 원근법으로 커져서 화면 밖으로 나간다.
    // 달력 모서리를 같은 변환(rotateY → rotateX → 원근)으로 투영해 화면 폭을 넘으면 그만큼 줄여서 항상 다 보이게 한다.
    function fit() {
      const W = $grid.offsetWidth, H = $grid.offsetHeight;
      if (!W || !H) return;
      const rx = (tiltX * Math.PI) / 180, ry = (tiltY * Math.PI) / 180;
      let maxX = 0;
      for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) {
        const x = (sx * W) / 2, y = (sy * H) / 2, z = sz * Z_MAX;
        const x1 = x * Math.cos(ry) + z * Math.sin(ry), z1 = -x * Math.sin(ry) + z * Math.cos(ry);
        const z2 = y * Math.sin(rx) + z1 * Math.cos(rx);
        maxX = Math.max(maxX, Math.abs(x1 * PERSPECTIVE / (PERSPECTIVE - z2)));
      }
      const avail = document.documentElement.clientWidth / 2 - 10;
      $wall.style.setProperty("--k", Math.min(1, avail / maxX).toFixed(3));
    }
    setTilt(tiltX, tiltY);

    let drag = null, suppressClick = false;
    $wall.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "touch" || e.button !== 0) return; // 터치는 페이지 스크롤에 양보
      drag = { x: e.clientX, y: e.clientY, moved: 0 };
    });
    addEventListener("pointermove", (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.moved += Math.abs(dx) + Math.abs(dy);
      drag.x = e.clientX; drag.y = e.clientY;
      setTilt(tiltX - dy * 0.15, tiltY + dx * 0.15);
    });
    addEventListener("pointerup", () => {
      if (drag && drag.moved > 6) { suppressClick = true; setTimeout(() => (suppressClick = false), 0); }
      drag = null;
    });
    // 드래그한 직후에는 카드가 클릭된 것으로 처리하지 않는다 (링크 이동 방지)
    $wall.addEventListener("click", (e) => { if (suppressClick) { e.preventDefault(); e.stopPropagation(); } }, true);

    // 가운데 카드일수록 앞으로 튀어나오게 깊이(z)를 준다
    function layoutDepth() {
      const cols = getComputedStyle($grid).gridTemplateColumns.split(" ").length || 1;
      const cards = [...$grid.querySelectorAll(".fcard")];
      const rows = Math.ceil(cards.length / cols) || 1;
      cards.forEach((c, i) => {
        const dc = (i % cols) - (cols - 1) / 2, dr = Math.floor(i / cols) - (rows - 1) / 2;
        const dist = Math.hypot(dc / Math.max(cols - 1, 1), dr / Math.max(rows - 1, 1));
        c.style.setProperty("--z", String(Math.round(32 - dist * 60)));
      });
    }
    new ResizeObserver(() => { layoutDepth(); fit(); }).observe($grid);

    // ── 월별 배경 사진 (Unsplash, 무료 라이선스 / 주소를 직접 연결하고 파일은 저장하지 않는다) ──
    // 새 사진으로 바꿀 때는 id(photo- 뒤 부분), 촬영자, 사진 페이지 주소를 함께 바꾼다.
    const BG = {
      1:  { id: "1736332654737-1224ed263915", by: "Pascal Debrunner", page: "https://unsplash.com/photos/Bd-PwE6KnSc" },  // 눈 덮인 들판의 나무
      2:  { id: "1737143765999-bd3be790ab4f", by: "Pascal Debrunner", page: "https://unsplash.com/photos/wvZ3zzUftD8" },  // 눈 덮인 들판과 산
      3:  { id: "1707541124067-4878d84b9e47", by: "Kanae Kanesaki",  page: "https://unsplash.com/photos/NBicygNxy2Q" },  // 이른 봄 흰 꽃가지
      4:  { id: "1775653273829-1f0cf2887de3", by: "Patrick Shaun",   page: "https://unsplash.com/photos/4meQsTrOla4" },  // 벚꽃
      5:  { id: "1587462710036-1969570afa6b", by: "Nick Page",       page: "https://unsplash.com/photos/1ucxmmvQdgQ" },  // 새 잎이 돋은 나무
      6:  { id: "1719178006695-e0e36780adac", by: "Bernd Dittrich",  page: "https://unsplash.com/photos/P7knt2DOvpc" },  // 초록 농경지
      7:  { id: "1675203921973-9983f7386cee", by: "Josie Weiss",     page: "https://unsplash.com/photos/M2QXVaj4ees" },  // 햇살이 비치는 초원
      8:  { id: "1721292175149-8a929b7635f7", by: "Austin",          page: "https://unsplash.com/photos/hnmqECheIkQ" },  // 노을 지는 작물 밭
      9:  { id: "1758003293450-b9478f02bf48", by: "Huy Nguyen",      page: "https://unsplash.com/photos/OBD62-MyPAQ" },  // 황금빛 다랑논
      10: { id: "1761839915942-019d1dea6145", by: "James Wainscoat", page: "https://unsplash.com/photos/dsll1jgW_FA" },  // 단풍 숲
      11: { id: "1762515993692-7b9946f76858", by: "Pascal Debrunner", page: "https://unsplash.com/photos/moHqJmdANys" },  // 안개 낀 늦가을 숲
      12: { id: "1768931482578-5ad93f78409d", by: "iuliu illes",     page: "https://unsplash.com/photos/jsTpgRWgP9o" },  // 눈 덮인 나무와 울타리
    };
    const bgUrl = (id) => `https://images.unsplash.com/photo-${id}?fm=jpg&q=70&w=1800&auto=format&fit=crop`;
    const $bg = document.getElementById("cal-bg"), $credit = document.getElementById("credit");
    let bgSeq = 0;
    function setBackground(month) {
      const b = BG[month];
      const seq = ++bgSeq;
      if (!b) return;
      const img = new Image(); // 다 받은 뒤에 바꿔서, 로딩 중에 빈 화면이 깜빡이지 않게 한다
      img.onload = () => {
        if (seq !== bgSeq) return;
        $bg.classList.remove("on");
        setTimeout(() => {
          if (seq !== bgSeq) return;
          $bg.style.backgroundImage = `url("${bgUrl(b.id)}")`;
          $bg.classList.add("on");
        }, reduceMotion ? 0 : 200);
      };
      img.onerror = () => { if (seq === bgSeq) $bg.classList.remove("on"); }; // 사진을 못 받으면 계절 색만 보인다
      img.src = bgUrl(b.id);
      const a = el("a", b.by);
      a.href = b.page; a.target = "_blank"; a.rel = "noopener noreferrer";
      $credit.replaceChildren(document.createTextNode("사진: "), a, document.createTextNode(" / Unsplash"));
    }

    // ── 식재료 카드 ───────────────────────────
    function foodCard(it, i, month, fromApi) {
      // 상세 페이지는 하나이고 주소의 번호만 바뀐다. 기본 데이터는 이름으로 찾는다.
      const href = fromApi ? `detail.html?sn=${encodeURIComponent(it.sn)}&m=${month}` : `detail.html?sample=${encodeURIComponent(it.name)}&m=${month}`;
      const a = el("a", null, "fcard");
      a.href = href;
      a.draggable = false;
      a.append(it.image ? safeImg(it.image, { alt: "" }) : placeholder("leaf", "4/3", ""));
      const cap = el("span", null, "cap");
      cap.append(el("span", it.name || "이름 없음", "nm"), el("span", String(i + 1).padStart(2, "0"), "no"));
      a.append(cap);
      return a;
    }

    // 목록은 한 번 받아 두고 같은 달을 다시 누르면 재사용한다
    const months = new Map(); // month -> { items, fromApi, error? }
    async function loadMonth(m) {
      const have = months.get(m);
      if (have?.fromApi) return have;
      // 목록은 foods-data.js 에 고정되어 있어 API 호출 없이 바로 나온다 (상세·레시피만 API)
      const fixed = window.FOOD_DATA?.months?.[m];
      if (fixed?.length) {
        const v = { items: fixed.map((i) => ({ ...i, image: foodPhotoUrl(i.sn, 800) })), fromApi: true };
        months.set(m, v);
        return v;
      }
      try {
        const d = await fetchFoodList(m);
        if (!d.items?.length) throw new Error("API 결과가 비어 있습니다");
        const v = { items: d.items, fromApi: true };
        months.set(m, v);
        return v;
      } catch (e) {
        const v = { items: window.SAMPLE_FOOD_MONTH[m] || [], fromApi: false, error: e.message };
        months.set(m, v);
        return v;
      }
    }

    // 연타로 달을 바꿀 때 늦게 도착한 이전 응답이 화면을 덮어쓰지 않게 한다
    let selectSeq = 0;
    async function select(month) {
      const seq = ++selectSeq;
      const [seasonCls, seasonName] = SEASONS[month];
      $months.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.month === month)));
      $frame.className = `cal-frame ${seasonCls}`;
      document.getElementById("cal-title").textContent = `${month}월`;
      document.getElementById("cal-meta").replaceChildren();
      document.title = `${month}월의 농식품`;
      setBackground(month);
      try { history.replaceState(null, "", `?m=${month}`); } catch {}  // 상세에서 돌아올 때 같은 달로 오도록

      $status.textContent = "불러오는 중…";
      $grid.replaceChildren();
      const v = await loadMonth(month);
      if (seq !== selectSeq) return;

      $status.textContent = v.fromApi ? "" : `기본 데이터로 표시 중 (${v.error})`;
      const meta = document.getElementById("cal-meta");
      meta.replaceChildren(el("b", seasonName), document.createTextNode(` · 제철 식재료 ${v.items.length}개`));
      v.items.forEach((it, i) => $grid.append(foodCard(it, i, month, v.fromApi)));
      if (!v.items.length) $grid.append(el("p", "표시할 데이터가 없습니다.", "empty"));
      layoutDepth();
      fit();
    }
    addEventListener("resize", fit);

    document.getElementById("fixed-at").textContent = window.FOOD_DATA?.fixedAt || "알 수 없음";
    document.getElementById("apibox-slot").append(apiBox("이 화면의 식재료 목록은 foods-data.js 에 고정돼 있어 API를 호출하지 않아요. 카드를 눌러 상세 화면으로 가면 호출해요."));

    const qm = Number(new URLSearchParams(location.search).get("m"));
    select(qm >= 1 && qm <= 12 ? qm : thisMonth);
  </script>
</body>
</html>
